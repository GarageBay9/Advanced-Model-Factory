# GitHub Actions workflow: builds the Windows app on a hosted Windows runner (PyInstaller cannot cross-compile).
# macOS is not supported at present, so there is no Mac job.
# Copy this file to .github/workflows/build-apps.yml in the repository. If the bostool folder is not at the repository
# root, change working-directory below to its path. Run it from the Actions tab (Run workflow); the app is attached
# to the run as a downloadable artifact.
name: Build AMF app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: bostool
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install requirements and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Check the packages import
        run: python -c "import tkinter, OpenGL, pyopengltk, PyInstaller; print('imports ok:', OpenGL.__version__, PyInstaller.__version__)"

      - name: Build the app
        run: python packaging/build_app.py

      - name: Upload the Windows app
        uses: actions/upload-artifact@v6
        with:
          name: AMF-windows
          path: bostool/packaging/dist/AMF.exe
